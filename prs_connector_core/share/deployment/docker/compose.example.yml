# Типовой запуск нескольких экземпляров одного коннектора.
# network_mode: host — доступ к оборудованию в LAN хоста и к MQTT на 127.0.0.1.
x-prs-connector: &prs-connector
  build:
    context: .
    dockerfile: deployment/docker/Dockerfile.example
  image: my-prs-connector:latest
  restart: unless-stopped
  network_mode: host
  working_dir: /state

services:
  connector-modbus-line-1:
    <<: *prs-connector
    environment:
      PRS_CONNECTOR_CONFIG: /configs/modbus-line-1.json
      TZ: Europe/Moscow
    volumes:
      - ./configs:/configs:ro
      - ./state/modbus-line-1:/state

  connector-modbus-line-2:
    <<: *prs-connector
    environment:
      PRS_CONNECTOR_CONFIG: /configs/modbus-line-2.json
      TZ: Europe/Moscow
    volumes:
      - ./configs:/configs:ro
      - ./state/modbus-line-2:/state
